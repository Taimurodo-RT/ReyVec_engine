name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Компилятор шейдеров Slang той же версии, что в Vulkan SDK на ПК Романа.
  SLANG_VERSION: "2026.17"

jobs:
  windows:
    name: Windows (fmt, clippy, test, update script)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Slang shader compiler
        shell: pwsh
        run: |
          $url = "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/slang-$env:SLANG_VERSION-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile slang.zip
          Expand-Archive slang.zip -DestinationPath "$env:RUNNER_TEMP\slang"
          Remove-Item slang.zip
          "$env:RUNNER_TEMP\slang\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:RUNNER_TEMP\slang\bin\slangc.exe" -v
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      # Проверяем тот же путь, которым Роман обновляет локальную версию,
      # причём в Windows PowerShell 5.1, как при запуске update.bat.
      # У машины CI нет видеокарты и Vulkan, поэтому окно здесь не открываем:
      # окно проверяет задача lavapipe ниже и Роман на своём ПК.
      - name: Local update script (Windows PowerShell)
        shell: powershell
        run: |
          .\scripts\update.ps1 -NoPull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\run.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\run.ps1 --help
          exit $LASTEXITCODE

  lavapipe:
    name: Linux, software Vulkan (GPU tests, window with validation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan, validation layers, virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb xdotool libxkbcommon-x11-0
          vulkaninfo --summary | grep -E "deviceName|apiVersion"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Slang shader compiler
        run: |
          mkdir -p "$RUNNER_TEMP/slang"
          curl -sSfL "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/slang-$SLANG_VERSION-linux-x86_64.tar.gz" | tar xz -C "$RUNNER_TEMP/slang"
          echo "REYVEC_SLANGC=$RUNNER_TEMP/slang/bin/slangc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/slang/bin/slangc" -v
      # Включая проверку перезагрузки шейдеров: правка файла пересобирает шейдер,
      # ошибка в шейдере не ломает прошлую версию.
      - name: GPU tests (headless scene with validation, shader hot reload)
        run: cargo test -p reyvec-gpu -- --include-ignored
      # 7 секунд: за это время сцена несколько раз загружает новую текстуру и удаляет старую.
      - name: Sandbox window, 7 seconds, validation on
        run: |
          cargo build -p reyvec-sandbox
          xvfb-run -a -s "-screen 0 1920x1080x24" ./target/debug/reyvec-sandbox --list-gpus
          xvfb-run -a -s "-screen 0 1920x1080x24" ./target/debug/reyvec-sandbox --validation --seconds 7
      # Окно всё время меняет размер: swapchain пересоздаётся без остановки видеокарты,
      # старый удаляется по заборам показа. Второй прогон: запасной путь без заборов.
      - name: Window resizing with validation (present fences and fallback)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" scripts/ci/resize-check.sh ./target/debug/reyvec-sandbox 5
          REYVEC_NO_PRESENT_FENCES=1 xvfb-run -a -s "-screen 0 1920x1080x24" scripts/ci/resize-check.sh ./target/debug/reyvec-sandbox 3

  deny:
    name: Licenses and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
