[package]
name = "reyvec-editor"
description = "Редактор ReyVec: сцена движка посередине, панели инструментов вокруг."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "reyvec-editor"
path = "src/main.rs"

[dependencies]
egui.workspace = true
egui-winit.workspace = true
glam.workspace = true
# Конвертеры ассетов (Э.6): звук WAV, OGG Vorbis, MP3, FLAC; картинки PNG, JPEG и др.
claxon = "0.4"
hound = "3.5"
image = { workspace = true, features = ["png", "jpeg", "bmp", "tga", "gif", "webp"] }
nanomp3 = "0.2"
vorbis_rs = { version = "0.5", default-features = false }
kurbo.workspace = true
# Проверка скриптов в редакторе кода: тот же Luau, что у движка (reyvec-script).
mlua = { version = "0.12", features = ["luau", "send"] }
reyvec-app.workspace = true
reyvec-gpu.workspace = true
reyvec-scene.workspace = true
reyvec-script.workspace = true
reyvec-sdf.workspace = true
# Сюжет (Сю.2): персонажи, диалоги, задания из папки story/ проекта.
reyvec-story.workspace = true
png.workspace = true
ron.workspace = true
serde.workspace = true
reyvec-vector.workspace = true
tracing.workspace = true
winit.workspace = true

[lints]
workspace = true
