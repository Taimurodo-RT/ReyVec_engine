# Настройки cargo-deny: какие лицензии зависимостей разрешены и откуда их брать.
# Разрешаем только лицензии, с которыми игры на ReyVec можно свободно продавать.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "OFL-1.1",
]
confidence-threshold = 0.9
# Список разрешённых лицензий заранее шире, чем нужно сейчас: не ругаемся на неиспользованные.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
