<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="circle"><circle cx="50" cy="50" r="40"/></clipPath>
    <clipPath id="ring" clip-rule="evenodd">
      <path clip-rule="evenodd" d="M 150 10 a 40 40 0 1 0 0.01 0 z M 150 30 a 20 20 0 1 0 0.01 0 z"/>
    </clipPath>
    <clipPath id="star" transform="translate(0 100)">
      <polygon points="50,5 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38"/>
    </clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="lum"><rect x="105" y="105" width="90" height="90" fill="url(#fade)"/></mask>
    <mask id="alpha" style="mask-type:alpha"><circle cx="150" cy="150" r="20" fill="black"/></mask>
    <pattern id="unused" width="4" height="4"/>
  </defs>
  <g id="stripes">
    <rect x="0" y="0" width="200" height="200" fill="#264653"/>
  </g>
  <g clip-path="url(#circle)">
    <rect x="0" y="0" width="100" height="100" fill="#e9c46a"/>
    <rect x="0" y="0" width="50" height="100" fill="#e76f51"/>
  </g>
  <g clip-path="url(#ring)">
    <rect x="100" y="0" width="100" height="100" fill="#2a9d8f"/>
    <rect x="100" y="45" width="100" height="10" fill="#e9c46a"/>
  </g>
  <g clip-path="url(#star)">
    <rect x="0" y="100" width="100" height="100" fill="#f4a261"/>
    <circle cx="50" cy="150" r="25" fill="#e76f51"/>
  </g>
  <g mask="url(#lum)">
    <rect x="105" y="105" width="90" height="40" fill="#e9c46a"/>
    <rect x="105" y="155" width="90" height="40" fill="#e76f51"/>
  </g>
  <g mask="url(#alpha)" opacity="0.8">
    <rect x="125" y="125" width="50" height="50" fill="#ffffff"/>
  </g>
</svg>
