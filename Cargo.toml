[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Taimurodo-RT/ReyVec_engine"
publish = false

[workspace.dependencies]
reyvec-app = { path = "crates/reyvec-app" }
reyvec-gpu = { path = "crates/reyvec-gpu" }
ash = "0.38"
ash-window = "0.13"
notify = "8"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
raw-window-handle = "0.6"
thiserror = "2"
# Tracy 0.14.1 (эта версия у Романа): к ней подходит только tracy-client 0.19.0 с tracy-client-sys 0.30.x.
# Протокол Tracy меняется между версиями, поэтому версии закреплены точно. Обновлять вместе с программой Tracy.
tracy-client = { version = "=0.19.0", default-features = false, features = ["enable", "manual-lifetime", "ondemand", "only-localhost", "broadcast"] }
tracy-client-sys = { version = ">=0.30.0, <0.31", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Без wayland-csd-adwaita: рамки окна на Wayland рисует система, а этот пакет тянет неподдерживаемый ttf-parser.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Зависимости собираем с оптимизацией даже в отладке: так движок не тормозит при разработке.
opt-level = 2

[profile.release]
debug = "line-tables-only"
